name: MLflow CI Workflow

on:
  push:
    branches:
      - main

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project
      run: |
        mlflow run MLProject --no-conda

    - name: Upload MLflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: mlruns/

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        MODEL_PATH=$(find mlruns -type d -name "model" | head -n 1)
        mlflow models build-docker -m $MODEL_PATH -n khrlanamm/crop-recommendation-model:latest

    - name: Push Docker Image
      run: |
        docker push khrlanamm/crop-recommendation-model:latest
